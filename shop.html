<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Order — Inkvio</title><link rel="icon" href="assets/inkvio-mark.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#fcf8f3;color:#241f1d;font-family:Inter,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:48px auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:42px}.brand img{width:38px}.brand b{font:800 22px Manrope}.card{background:#fff;border:1px solid #eaded6;border-radius:24px;padding:32px;box-shadow:0 18px 55px rgba(83,38,31,.08);display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr);column-gap:34px;align-items:start}.card>.shop-tag,.card>h1,.card>p,.card>form,.card>#result{grid-column:1}.shop-tag{color:#9b4937;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font:800 34px Manrope;margin:8px 0}h2{font:800 24px Manrope;margin:6px 0}p{color:#75635d;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,textarea,select{width:100%;border:1px solid #dfd1c8;background:#fffdfb;border-radius:12px;padding:13px 14px;font:inherit;outline:none}input[hidden]{display:none}textarea{min-height:100px}.upload-zone{border:1.5px dashed #d9b8aa;border-radius:14px;background:#fffaf6;padding:20px;text-align:center;position:relative}.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload-icon{font-size:22px}.file-list{display:grid;gap:7px;margin-top:9px}.file-chip{display:flex;justify-content:space-between;padding:9px 11px;border:1px solid #eadbd3;border-radius:10px}.hint{font-size:10px;color:#927e76}.success{padding:14px;background:#fff5ed;border:1px solid #efc9b7;border-radius:12px;margin-top:12px}.success strong{color:#8f2935}button{border:0;border-radius:12px;padding:14px 20px;background:linear-gradient(135deg,#8f2935,#c4512e);color:#fff;font-weight:800;cursor:pointer;margin-top:20px}button:disabled{opacity:.55}.state{text-align:center;padding:36px}.history-section{grid-column:2;grid-row:1/7;border:1px solid #eaded6;border-radius:18px;background:#fffaf6;padding:22px;margin:0;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}.history-title{display:flex;align-items:center;justify-content:space-between;gap:16px}.refresh-btn{margin:0;background:#fff;color:#8f2935;border:1px solid #efc9b7;padding:10px 14px}.history-order{border:1px solid #eaded6;border-radius:16px;padding:16px;margin-top:12px;background:#fff}.history-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.history-head strong{display:block}.history-head span{display:block;color:#927e76;font-size:12px;margin-top:4px}.status-chip{font-size:11px;border-radius:999px;padding:7px 10px;background:#f4e8e1;white-space:nowrap}.status-ready{background:#e8f5ec;color:#267344}.status-printing{background:#fff0db;color:#955810}.status-design{background:#eee9fb;color:#5b46a5}.history-meta{display:flex;gap:18px;font-weight:700;margin:14px 0;color:#7d202d}.history-order summary{cursor:pointer;font-size:13px;font-weight:700}.history-order pre{white-space:pre-wrap;font:13px/1.6 Inter;margin-bottom:0;color:#65544e}.history-empty{padding:18px;border:1px dashed #d9b8aa;border-radius:14px;color:#806c64;background:#fff}.security-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#35171b;color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;box-shadow:0 15px 45px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.22s;z-index:9999}.security-toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.wrap{width:min(720px,calc(100% - 32px))}.card{display:block}.history-section{position:static;max-height:none;margin-top:30px}}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:22px}.wrap{margin:28px auto}.history-head{display:grid}.history-title{align-items:flex-end}}</style></head><body><main class="wrap"><div class="brand"><img src="assets/inkvio-mark.svg" alt=""><b>Inkvio</b></div><section class="card" id="shopCard"><div class="state">Loading shop…</div></section></main><script src="shop.js?v=1031blob2"></script></body></html>
