<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Order — Inkvio</title><link rel="icon" href="assets/inkvio-mark.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#fcf8f3;color:#241f1d;font-family:Inter,sans-serif}.wrap{width:min(720px,calc(100% - 32px));margin:48px auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:42px}.brand img{width:38px}.brand b{font:800 22px Manrope}.card{background:#fff;border:1px solid #eaded6;border-radius:24px;padding:32px;box-shadow:0 18px 55px rgba(83,38,31,.08)}.shop-tag{color:#9b4937;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font:800 34px Manrope;margin:8px 0}p{color:#75635d;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,textarea{width:100%;border:1px solid #dfd1c8;background:#fffdfb;border-radius:12px;padding:13px 14px;font:inherit;outline:none}input:focus,textarea:focus{border-color:#b44b32;box-shadow:0 0 0 3px rgba(180,75,50,.1)}textarea{min-height:110px;resize:vertical}.upload-zone{border:1.5px dashed #d9b8aa;border-radius:14px;background:#fffaf6;padding:20px;text-align:center;position:relative;transition:.2s}.upload-zone:hover,.upload-zone.drag{border-color:#b44b32;background:#fff5ee}.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload-icon{width:42px;height:42px;border-radius:12px;background:#f6e5dd;display:grid;place-items:center;margin:0 auto 8px;color:#a63d31;font-size:21px;font-weight:800}.upload-zone strong{display:block;font-size:13px}.upload-zone small{display:block;color:#8b746b;margin-top:5px;font-size:11px}.file-list{display:grid;gap:7px;margin-top:9px}.file-chip{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;border:1px solid #eadbd3;border-radius:10px;background:#fff;font-size:11px}.file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-chip b{color:#8c756d;font-weight:600;white-space:nowrap}.or{display:flex;align-items:center;gap:10px;color:#a18d85;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:4px 0}.or:before,.or:after{content:'';height:1px;background:#eee2dc;flex:1}.hint{font-size:10px;color:#927e76;margin-top:-1px}button{border:0;border-radius:12px;padding:14px 20px;background:linear-gradient(135deg,#8f2935,#c4512e);color:white;font-weight:800;cursor:pointer;margin-top:20px}button:disabled{opacity:.55;cursor:wait}.state{text-align:center;padding:36px}.success{padding:18px;background:#fff5ed;border:1px solid #efc9b7;border-radius:14px;margin-top:20px}.success strong{display:block;margin-bottom:4px}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:22px}.wrap{margin:28px auto}}</style></head><body><main class="wrap"><div class="brand"><img src="assets/inkvio-mark.svg" alt=""><b>Inkvio</b></div><section class="card" id="shopCard"><div class="state">Loading shop…</div></section></main><script src="shop.js?v=2"></script></body></html>
